<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Noche de Copa — Ruleta de Plantillas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#0A1F18;
    --bg-panel:#102A21;
    --bg-panel-2:#15352A;
    --stripe-a:#123527;
    --stripe-b:#0E2C21;
    --line:#24493A;
    --gold:#D4AF37;
    --gold-dim:#8C7A2E;
    --sky:#3E8FC1;
    --red:#C1503E;
    --text:#F2F0E6;
    --text-dim:#9FB3A8;
    --text-faint:#5E7A6C;
    --gk:#B08BD6;
    --df:#3E8FC1;
    --mf:#5FB07A;
    --fw:#D4664A;
    --reel-h:46px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg-deep);
    background-image:
      repeating-linear-gradient(90deg, var(--stripe-a) 0px, var(--stripe-a) 64px, var(--stripe-b) 64px, var(--stripe-b) 128px);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    line-height:1.45;
  }
  h1,h2,h3,.headline{
    font-family:'Oswald',sans-serif;
    font-weight:600;
    letter-spacing:0.01em;
    margin:0;
  }
  #app{max-width:880px;margin:0 auto;padding:20px 16px 64px;}
  .topbar{display:flex;align-items:baseline;justify-content:space-between;padding:14px 0 18px;border-bottom:2px solid var(--gold);margin-bottom:22px;gap:10px;flex-wrap:wrap;}
  .topbar .mark{font-family:'Oswald',sans-serif;font-weight:700;font-size:20px;letter-spacing:0.02em;color:var(--gold);}
  .topbar .mark span{color:var(--text);}
  .steps{display:flex;gap:6px;font-size:12px;color:var(--text-faint);flex-wrap:wrap;}
  .steps .step{padding:4px 10px;border:1px solid var(--line);border-radius:2px;}
  .steps .step.active{border-color:var(--gold);color:var(--gold);}
  .steps .step.done{color:var(--text-dim);border-color:var(--text-faint);}
  .panel{background:var(--bg-panel);border:1px solid var(--line);padding:22px;margin-bottom:16px;}
  .lead{font-size:15px;color:var(--text-dim);max-width:60ch;}
  .btn{font-family:'Inter',sans-serif;font-weight:600;font-size:14px;padding:11px 20px;border:1px solid var(--gold);background:transparent;color:var(--gold);cursor:pointer;transition:background .15s ease, color .15s ease;}
  .btn:hover{background:var(--gold);color:#0A1F18;}
  .btn:disabled{opacity:0.35;cursor:not-allowed;border-color:var(--text-faint);color:var(--text-faint);}
  .btn:disabled:hover{background:transparent;color:var(--text-faint);}
  .btn-primary{background:var(--gold);color:#0A1F18;}
  .btn-primary:hover{background:#e8c65a;}
  .btn-ghost{border-color:var(--line);color:var(--text-dim);}
  .btn-ghost:hover{background:var(--bg-panel-2);color:var(--text);}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .row-between{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}

  input[type="text"]{background:var(--bg-panel-2);border:1px solid var(--line);color:var(--text);font-family:'Inter',sans-serif;font-size:14px;padding:10px 12px;width:100%;}
  input[type="text"]:focus{outline:1px solid var(--gold);}
  input[type="number"]{background:var(--bg-panel-2);border:1px solid var(--line);color:var(--text);font-family:'Inter',sans-serif;font-size:14px;padding:10px 12px;width:80px;}
  label{font-size:13px;color:var(--text-dim);display:block;margin-bottom:6px;}
  .field{margin-bottom:14px;}

  .player-list{display:flex;flex-direction:column;gap:8px;margin:14px 0;}
  .player-row{display:flex;gap:10px;align-items:center;}
  .player-row .num{width:22px;color:var(--text-faint);font-size:13px;}

  .turn-header .turn{font-family:'Oswald',sans-serif;font-size:22px;color:var(--gold);}
  .turn-header .sub{color:var(--text-dim);font-size:13px;margin-top:2px;}
  .needs-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
  .need-chip{font-size:12px;padding:4px 10px;border:1px solid var(--line);background:var(--bg-panel-2);}
  .need-chip.done{color:var(--text-faint);text-decoration:line-through;border-color:var(--text-faint);}

  .formation-select{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0;}
  .formation-chip{padding:8px 14px;border:1px solid var(--line);background:var(--bg-panel-2);cursor:pointer;font-family:'Oswald',sans-serif;font-size:14px;color:var(--text-dim);}
  .formation-chip.selected{border-color:var(--gold);color:var(--gold);}
  .formation-shape{font-size:11px;color:var(--text-faint);margin-top:6px;}

  .squad-strip{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;}
  .squad-chip{font-size:11px;padding:3px 8px;background:var(--bg-panel-2);border:1px solid var(--line);color:var(--text-dim);}

  .pitch{
    position:relative;width:100%;max-width:300px;margin:16px auto 6px;aspect-ratio:2/3;
    background:repeating-linear-gradient(0deg, #1c4a34 0px, #1c4a34 34px, #173f2c 34px, #173f2c 68px);
    border:2px solid rgba(255,255,255,0.45);border-radius:6px;overflow:hidden;
  }
  .pitch-halfway{position:absolute;left:0;right:0;top:50%;height:2px;background:rgba(255,255,255,0.4);}
  .pitch-circle{position:absolute;left:50%;top:50%;width:68px;height:68px;border:2px solid rgba(255,255,255,0.4);border-radius:50%;transform:translate(-50%,-50%);}
  .pitch-box{position:absolute;left:50%;width:56%;height:13%;border:2px solid rgba(255,255,255,0.4);transform:translateX(-50%);}
  .pitch-box-top{top:0;border-top:none;}
  .pitch-box-bottom{bottom:0;border-bottom:none;}
  .slot{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;line-height:1.05;z-index:2;}
  .slot.n3{width:56px;}
  .slot.n4{width:48px;}
  .slot.n5{width:40px;}
  .slot.filled .jersey{width:65%;}
  .slot.filled .jersey-svg{width:100%;display:block;filter:drop-shadow(0 1px 2px rgba(0,0,0,0.5));}
  .slot.filled .slot-name{font-family:'Oswald',sans-serif;font-size:9px;font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text);text-shadow:0 1px 2px rgba(0,0,0,0.8);margin-top:1px;}
  .slot.empty{border-radius:50%;background:rgba(255,255,255,0.07);border:2px dashed rgba(255,255,255,0.4);color:rgba(255,255,255,0.55);aspect-ratio:1;justify-content:center;}
  .slot.empty .slot-pos{font-size:10px;font-weight:600;}
  @media (max-width:520px){ .pitch{max-width:260px;} }

  .badge-pos{display:inline-block;font-size:11px;font-weight:600;padding:2px 6px;border-radius:2px;color:#0A1F18;}
  .badge-pos.GK{background:var(--gk);}
  .badge-pos.DF{background:var(--df);}
  .badge-pos.MF{background:var(--mf);}
  .badge-pos.FW{background:var(--fw);}

  .wheel-stage{display:flex;justify-content:center;gap:26px;margin:22px 0 8px;flex-wrap:wrap;}
  .wheel-block{text-align:center;}
  .wheel-label{font-size:11px;color:var(--text-faint);margin-bottom:8px;letter-spacing:0.03em;}
  .wheel{position:relative;width:230px;height:var(--reel-h);overflow:hidden;border:2px solid var(--gold);background:var(--bg-panel-2);}
  .wheel .reel{display:flex;flex-direction:column;will-change:transform;}
  .reel-item{height:var(--reel-h);min-height:var(--reel-h);display:flex;align-items:center;justify-content:center;font-family:'Oswald',sans-serif;font-size:14px;padding:0 10px;text-align:center;color:var(--text);}
  .wheel::before,.wheel::after{content:"";position:absolute;left:0;right:0;height:14px;pointer-events:none;z-index:2;}
  .wheel::before{top:0;background:linear-gradient(var(--bg-panel-2), transparent);}
  .wheel::after{bottom:0;background:linear-gradient(transparent, var(--bg-panel-2));}
  .wheel-arrow{position:absolute;top:50%;transform:translateY(-50%);color:var(--gold);font-size:13px;z-index:3;}
  .wheel-arrow.left{left:-16px;}
  .wheel-arrow.right{right:-16px;}

  .pack-reveal{margin-top:18px;padding:18px;background:var(--bg-panel-2);border:1px solid var(--gold);display:none;}
  .pack-reveal.show{display:block;}
  .pack-reveal .pack-tag{font-size:13px;color:var(--text-dim);margin-bottom:4px;}
  .stars{color:var(--gold);font-size:13px;letter-spacing:1px;}

  .pos-group{margin-top:16px;}
  .pos-group .pos-title{font-size:13px;color:var(--text-dim);margin-bottom:8px;}
  .pick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;}
  .pick-card{background:var(--bg-panel-2);border:1px solid var(--line);border-left:4px solid var(--pos-color, var(--gold));padding:10px;cursor:pointer;font-size:12px;}
  .pick-card:hover{border-color:var(--gold);}
  .pick-card.disabled{opacity:0.3;cursor:not-allowed;}
  .pick-card.disabled:hover{border-color:var(--line);}
  .pick-card .pname{font-family:'Oswald',sans-serif;font-size:13px;margin-bottom:4px;}
  .pick-card .card-ovr{font-family:'Oswald',sans-serif;font-size:16px;color:var(--gold);}
  .pick-card .ptag{color:var(--text-faint);font-size:10px;}

  .team-ratings{display:flex;gap:18px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line);}
  .team-ratings .stat{text-align:left;}
  .team-ratings .stat .label{font-size:11px;color:var(--text-faint);}
  .team-ratings .stat .val{font-family:'Oswald',sans-serif;font-size:26px;color:var(--gold);}

  .bracket{display:flex;gap:24px;overflow-x:auto;padding-bottom:10px;}
  .bracket-round{display:flex;flex-direction:column;justify-content:center;gap:22px;min-width:200px;}
  .bracket-round .round-title{font-size:11px;color:var(--text-faint);text-align:center;margin-bottom:2px;}
  .match{background:var(--bg-panel-2);border:1px solid var(--line);padding:0;}
  .match .side{display:flex;justify-content:space-between;padding:8px 10px;font-size:13px;border-bottom:1px solid var(--line);}
  .match .side:last-child{border-bottom:none;}
  .match .side.winner{color:var(--gold);font-weight:600;}
  .match .side.human .tname::before{content:"● ";color:var(--sky);}
  .match .score{font-family:'Oswald',sans-serif;}
  .match .pending{color:var(--text-faint);}

  .trophy-screen{text-align:center;padding:30px 10px;}
  .trophy-screen .cup{font-size:56px;margin-bottom:6px;}
  .trophy-screen h2{font-size:30px;color:var(--gold);margin-bottom:6px;}
  .standings{margin-top:20px;text-align:left;display:flex;flex-direction:column;gap:6px;}
  .standings .srow{display:flex;justify-content:space-between;padding:8px 12px;background:var(--bg-panel-2);border-left:3px solid var(--line);font-size:13px;}
  .standings .srow.human{border-left-color:var(--sky);}
  .standings .srow.champion{border-left-color:var(--gold);}

  .footer-actions{margin-top:24px;display:flex;justify-content:flex-end;}
  .kit-grid,.coach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:9px;margin:12px 0 18px;}
  .kit-card,.coach-card{border:1px solid var(--line);background:var(--bg-panel-2);padding:11px;cursor:pointer;}
  .kit-card.selected,.coach-card.selected{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold);}
  .kit-swatch{height:28px;border:1px solid rgba(255,255,255,.25);margin-bottom:7px;}
  .coach-card .cname{font-family:'Oswald',sans-serif;font-size:15px;color:var(--text);}
  .coach-card .cfit{font-size:11px;color:var(--text-faint);margin-top:4px;}
  .coach-bonus{font-family:'Oswald',sans-serif;color:var(--gold);font-size:13px;margin-top:4px;}
  .pitch-wrap{position:relative;max-width:380px;margin:0 auto;}
  .coach-figure{position:absolute;right:0;bottom:16px;width:58px;text-align:center;font-size:9px;color:var(--text-dim);z-index:4;}
  .coach-head{width:18px;height:18px;border-radius:50%;background:#d7aa7c;margin:0 auto 2px;border:1px solid #222;}
  .coach-body{width:25px;height:34px;background:#222;border:2px solid var(--gold);margin:0 auto;border-radius:8px 8px 3px 3px;position:relative;}
  .coach-body:before,.coach-body:after{content:"";position:absolute;top:7px;width:18px;height:4px;background:#222;}
  .coach-body:before{left:-15px;transform:rotate(28deg)} .coach-body:after{right:-15px;transform:rotate(-28deg)}
  .lineup-board{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-top:14px;}
  .lineup-card{background:var(--bg-panel-2);border:1px solid var(--line);padding:12px;}
  .lineup-card h3{font-size:17px;color:var(--gold);}
  .scorers{padding:5px 10px 8px;font-size:10px;color:var(--text-dim);border-top:1px dashed var(--line);line-height:1.5;}

  @media (max-width:520px){
    .team-ratings{gap:10px;}
    .bracket{gap:16px;}
    .bracket-round{min-width:170px;}
    .wheel{width:150px;}
    .wheel-stage{gap:14px;}
  }

  /* ===== MODO 1 VS 1 ===== */
  .mode-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:18px}.mode-card{padding:22px;border:1px solid var(--line);background:var(--bg-panel-2);cursor:pointer;text-align:left}.mode-card:hover{border-color:var(--gold)}.mode-icon{font-size:34px}.mode-card h2{color:var(--gold);margin:8px 0 4px}.mode-card p{color:var(--text-dim);font-size:13px;margin:0}
  .match-scoreboard{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;text-align:center}.match-score{font:700 40px 'Oswald',sans-serif;color:var(--gold)}.match-team{font:600 18px 'Oswald',sans-serif}.match-clock{font:600 18px 'Oswald',sans-serif;color:var(--text-dim)}
  .timeline-wrap{margin:22px 0 8px}.timeline{height:14px;background:#071711;border:1px solid var(--line);position:relative;border-radius:8px}.timeline-fill{height:100%;background:var(--gold);border-radius:8px;transition:width .45s ease}.timeline-ball{position:absolute;top:50%;transform:translate(-50%,-50%);font-size:18px;transition:left .45s ease}.timeline-labels{display:flex;justify-content:space-between;color:var(--text-faint);font-size:10px;margin-top:6px}.event-feed{max-height:260px;overflow:auto;margin-top:14px}.event-line{padding:9px 10px;border-left:2px solid var(--line);margin:5px 0;background:var(--bg-panel-2);font-size:12px}.event-line.major{border-color:var(--gold);color:var(--text)}.event-line.bad{border-color:var(--red)}
  .weather-banner{display:flex;gap:8px;align-items:center;padding:9px 12px;background:var(--bg-panel-2);border:1px solid var(--line);margin:12px 0;font-size:12px}.decision{border:1px solid var(--gold);background:var(--bg-panel-2);padding:16px;margin-top:14px}.decision h3{color:var(--gold);margin-bottom:8px}.choice-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.choice-grid .btn{width:100%}
  .subs-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.subs-list{background:var(--bg-panel-2);padding:10px}.sub-player{display:flex;justify-content:space-between;align-items:center;padding:8px;border-bottom:1px solid var(--line);font-size:12px}.sub-player button{font-size:10px;padding:5px 7px}.match-actions{display:flex;justify-content:center;gap:8px;margin-top:16px;flex-wrap:wrap}.bench-label{font-size:11px;color:var(--text-faint);margin:8px 0 4px}.status-pill{font-size:10px;border:1px solid var(--line);padding:2px 6px;border-radius:10px;color:var(--text-dim)}
  @media(max-width:520px){.mode-grid,.subs-grid{grid-template-columns:1fr}.match-team{font-size:15px}.match-score{font-size:32px}.choice-grid{grid-template-columns:1fr}}
.assignment-list{display:grid;gap:7px;margin-top:12px}.assignment-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px;border:1px solid var(--line);background:var(--bg-panel-2)}.assignment-row span{display:flex;flex-direction:column}.assignment-row small{color:var(--text-dim)}.slot-select{min-width:135px;background:var(--bg-deep);color:var(--text);border:1px solid var(--line);padding:8px;border-radius:3px}
.placement-wrap{max-width:620px;margin:14px auto 0}.placement-pitch-shell{display:grid;grid-template-columns:minmax(0,1fr) 92px;gap:10px;align-items:stretch}.placement-pitch{position:relative;aspect-ratio:68/105;background:linear-gradient(90deg,rgba(255,255,255,.025) 50%,rgba(0,0,0,.025) 50%),#17643d;border:2px solid rgba(255,255,255,.55);overflow:hidden}.placement-pitch:before{content:"";position:absolute;left:0;right:0;top:50%;border-top:1px solid rgba(255,255,255,.55)}.placement-pitch:after{content:"";position:absolute;width:24%;aspect-ratio:1;border:1px solid rgba(255,255,255,.55);border-radius:50%;left:38%;top:calc(50% - 12%)}.place-slot{position:absolute;transform:translate(-50%,-50%);width:54px;min-height:48px;border-radius:50%;border:2px dashed rgba(255,255,255,.28);background:rgba(0,0,0,.16);display:flex;align-items:center;justify-content:center;text-align:center;font-size:9px;color:rgba(255,255,255,.55);padding:4px;z-index:2}.place-slot.available{border-style:solid;border-color:#f4d35e;background:rgba(244,211,94,.2);color:#fff;box-shadow:0 0 0 3px rgba(244,211,94,.12),0 0 18px rgba(244,211,94,.5);cursor:pointer;animation:pulseSlot 1.15s infinite alternate}.place-slot.occupied{border-style:solid;border-color:rgba(255,255,255,.45);background:rgba(0,0,0,.42);color:#fff}.place-slot.prematch-selected{outline:3px solid var(--gold);outline-offset:2px;box-shadow:0 0 22px rgba(212,175,55,.8)}.place-slot .mini-name{font-family:'Oswald',sans-serif;font-weight:600;line-height:1.05}.bench-zone{border:1px solid var(--line);background:var(--bg-panel-2);padding:7px;display:flex;flex-direction:column;gap:7px}.bench-zone-title{font-family:'Oswald',sans-serif;color:var(--gold);font-size:12px;text-align:center}.bench-slot{position:relative!important;transform:none!important;left:auto!important;top:auto!important;width:100%;min-height:49px;border-radius:5px}.placement-player{padding:10px 12px;background:var(--bg-panel-2);border-left:3px solid var(--gold);margin:10px 0}.placement-player strong{color:var(--gold)}@keyframes pulseSlot{from{filter:brightness(.92)}to{filter:brightness(1.25)}}
@media(max-width:520px){.placement-pitch-shell{grid-template-columns:minmax(0,1fr) 78px}.place-slot{width:45px;min-height:42px;font-size:8px}.bench-zone{padding:5px;gap:5px}.bench-slot{width:100%;min-height:43px}}
.draft-live-lineup{margin-top:14px}.draft-player-slot{flex-direction:column;gap:0;padding:2px}.draft-mini-jersey{width:27px;height:27px;line-height:0}.draft-mini-jersey .jersey-svg{width:100%;height:100%}.draft-player-slot .mini-name{font-size:9px;max-width:48px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.draft-player-slot small{font-size:7px;color:var(--gold)}.draft-bench-player{display:grid;grid-template-columns:24px 1fr;grid-template-rows:auto auto;column-gap:3px;align-items:center;text-align:left;padding:3px}.draft-bench-player .draft-mini-jersey{grid-row:1/3;width:22px;height:22px}.draft-bench-player .mini-name{font-size:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.draft-bench-player small{font-size:7px;color:var(--text-dim)}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============================= DATA: PLANTILLAS HISTÓRICAS REALES ============================= */
/* Los nombres, clubes y temporadas son reales y verificados. Las estadísticas de juego (ataque,
   defensa, velocidad) son una aproximación de juego, no cifras oficiales. */
const REAL_SQUADS = [
  { club:"AC Milan", season:"88/89", tier:5, players:[
    {name:"Giovanni Galli", position:"GK"}, {name:"Andrea Antonioli", position:"GK"},
    {name:"Mauro Tassotti", position:"DF"}, {name:"Paolo Maldini", position:"DF"}, {name:"Franco Baresi", position:"DF"}, {name:"Alessandro Costacurta", position:"DF"}, {name:"Roberto Mussi", position:"DF"},
    {name:"Frank Rijkaard", position:"MF"}, {name:"Alberigo Evani", position:"MF"}, {name:"Carlo Ancelotti", position:"MF"}, {name:"Roberto Donadoni", position:"MF"}, {name:"Filippo Colombo", position:"MF"},
    {name:"Marco van Basten", position:"FW"}, {name:"Pietro Virdis", position:"FW"}, {name:"Ruud Gullit", position:"FW"}, {name:"Stefano Mannari", position:"FW"}
  ]},
  { club:"FC Barcelona", season:"91/92", tier:5, players:[
    {name:"Andoni Zubizarreta", position:"GK"}, {name:"Carles Busquets", position:"GK"},

function hashStr(str){
  let h=0;
  for(let i=0;i<str.length;i++){ h = (h*31 + str.charCodeAt(i)) >>> 0; }
  return h;
}
function seededRand(seed){
  const x = Math.sin(seed)*10000;
  return x - Math.floor(x);
}
function statsFor(name, position, tier){
  const tierBonus = TIER_BONUS[tier] || 0;
  const marquee = MARQUEE_RATINGS[name];
  if(marquee!==undefined){
    let attack,defense,pace;
    if(position==="FW"){ attack=clamp(marquee+4,40,99); defense=clamp(marquee-38,15,60); pace=clamp(marquee+1,40,99); }
    else if(position==="MF"){ attack=clamp(marquee-2,40,96); defense=clamp(marquee-10,35,90); pace=clamp(marquee-3,40,96); }
    else if(position==="DF"){ attack=clamp(marquee-22,25,80); defense=clamp(marquee+5,50,99); pace=clamp(marquee-8,35,90); }
    else { attack=clamp(marquee-50,10,45); defense=clamp(marquee+6,55,99); pace=clamp(marquee-20,25,70); }
    return {attack, defense, pace, overall: clamp(marquee,20,99)};
  }
  const h = hashStr(name+"|"+position);
  const r1 = seededRand(h), r2 = seededRand(h+1), r3 = seededRand(h+2);
  const range = (r,min,max) => Math.round(min + r*(max-min));
  let attack,defense,pace;
  if(position==="GK"){attack=range(r1,15,35);defense=range(r2,70,96);pace=range(r3,35,60);}
  else if(position==="DF"){attack=range(r1,30,58);defense=range(r2,62,93);pace=range(r3,50,80);}
  else if(position==="MF"){attack=range(r1,52,86);defense=range(r2,42,76);pace=range(r3,52,84);}
  else {attack=range(r1,68,97);defense=range(r2,18,45);pace=range(r3,58,96);}
  attack = clamp(attack+tierBonus, 15, 99);
  defense = clamp(defense+tierBonus, 15, 99);
  pace = clamp(pace+Math.round(tierBonus*0.5), 15, 99);
  let overall;
  if(position==="GK") overall = Math.round(defense*0.6+pace*0.2+attack*0.2);
  else if(position==="DF") overall = Math.round(defense*0.5+pace*0.25+attack*0.25);
  else if(position==="MF") overall = Math.round((attack+defense+pace)/3);
  else overall = Math.round(attack*0.55+pace*0.3+defense*0.15);
  return {attack, defense, pace, overall: clamp(overall,20,99)};
}

/* ============================= PITCH LAYOUT ============================= */
function spreadRow(n, y){
  if(n<=0) return [];
  if(n===1) return [{x:50,y}];
  const margin=18;
  const arr=[];
  for(let i=0;i<n;i++){
    const x = margin + (100-2*margin)*(i/(n-1));
    arr.push({x,y});
  }
  return arr;
}
function getFormationLayout(formationName){
  const req = FORMATIONS[formationName];
  const layout = {};
  layout.GK = [{x:50,y:91}];
  layout.DF = spreadRow(req.DF, 72);
  if(req.MF>=5){
    const backCount = Math.ceil(req.MF/2);
    const frontCount = req.MF-backCount;
    layout.MF = [...spreadRow(backCount,56), ...spreadRow(frontCount,38)];
  } else {
    layout.MF = spreadRow(req.MF, 48);
  }
  layout.FW = spreadRow(req.FW, 18);
  return layout;
}
function posColorVar(pos){
  return {GK:"var(--gk)",DF:"var(--df)",MF:"var(--mf)",FW:"var(--fw)"}[pos];
}
function jerseySVG(primary, secondary){
  return `<svg viewBox="0 0 100 100" class="jersey-svg">
    <path d="M30 10 L10 25 L20 42 L30 33 L30 92 L70 92 L70 33 L80 42 L90 25 L70 10 L60 18 Q50 25 40 18 Z" style="fill:${primary}; stroke:rgba(0,0,0,0.35); stroke-width:2;"/>
    <path d="M30 10 L40 18 Q50 25 60 18 L70 10 L63 5 Q50 14 37 5 Z" style="fill:${secondary};"/>
  </svg>`;
}
function renderPitchHTML(formationName, squad, kit, coach){
  const layout = getFormationLayout(formationName);
  const byPos = {GK:[],DF:[],MF:[],FW:[]};
  squad.forEach(p=>byPos[p.position].push(p));
  let slotsHtml = "";
  ["GK","DF","MF","FW"].forEach(pos=>{
    const positions = layout[pos];
    const sizeClass = positions.length>=5 ? "n5" : (positions.length===4 ? "n4" : "n3");
    positions.forEach((coord,i)=>{
      const player = byPos[pos][i];
      if(player){
        const last = player.name.trim().split(" ").slice(-1)[0];
        const colors = kit || CLUB_COLORS[player.fromClub] || {primary:"#7a7a7a", secondary:"#444444"};
        slotsHtml += `<div class="slot filled ${sizeClass}" style="left:${coord.x}%; top:${coord.y}%;" title="${escapeHtml(player.name)} (${escapeHtml(player.fromClub)} ${escapeHtml(player.fromSeason)})">
          <div class="jersey">${jerseySVG(colors.primary, colors.secondary)}</div>
          <span class="slot-name">${escapeHtml(last)}</span>
        </div>`;
      } else {
        slotsHtml += `<div class="slot empty ${sizeClass}" style="left:${coord.x}%; top:${coord.y}%;">
          <span class="slot-pos">${pos}</span>
        </div>`;
      }
    });
  });
  const coachHtml = coach ? `<div class="coach-figure" title="${escapeHtml(coach.name)}"><div class="coach-head"></div><div class="coach-body"></div><div>${escapeHtml(coach.name.split(" ").slice(-1)[0])}</div></div>` : "";
  return `<div class="pitch-wrap"><div class="pitch">
    <div class="pitch-halfway"></div>
    <div class="pitch-circle"></div>
    <div class="pitch-box pitch-box-top"></div>
    <div class="pitch-box pitch-box-bottom"></div>
    ${slotsHtml}
  </div>${coachHtml}</div>`;
}

  }).join("") + `</div>`;
}

function startDraft(){
  S.needs = {};
  S.squads = {};
  for(let i=0;i<S.numPlayers;i++){
    const req = FORMATIONS[S.formationChoice[i]];
    S.needs[i] = S.mode==="versus" ? {GK:2, DF:req.DF+1, MF:req.MF+2, FW:req.FW+1} : {GK:1, DF:req.DF, MF:req.MF, FW:req.FW};
    S.squads[i] = [];
  }
  S.order = Array.from({length:S.numPlayers},(_,i)=>i);
  S.turnCounter = 0;
  S.picksThisTurn = 0;
  S.pendingSquadIdx = null;
  S.spinning = false;
  S.draftRound=1; S.roundPicks={}; for(let i=0;i<S.numPlayers;i++) S.roundPicks[i]=0; S.roundReview=false; S.finalLineupReview=false;
  S.phase = "draft";
  render();
}

/* ============================= DRAFT (ruleta de plantillas) ============================= */
function draftTarget(){ return S.mode==="versus" ? 16 : 11; }
function currentTurnPlayer(){
  return S.order[S.turnCounter % S.numPlayers];
}

function squadChips(playerIdx){
  const squad = S.squads[playerIdx];
  if(!squad.length) return `<span class="squad-chip">Plantilla vacía todavía</span>`;
  return squad.map(p=>`<span class="squad-chip">${p.position} · ${escapeHtml(p.name)} (${p.overall})</span>`).join("");
}

function versusOpenSlotInfo(i){
  const slots=allVersusPlacementSlots(i);
  const assigned=S.lineupAssignments[i]||{};
  const occupied=new Set(Object.values(assigned));
  const field={GK:0,DF:0,MF:0,FW:0};
  let bench=0;
  slots.forEach(sl=>{
    if(occupied.has(sl.id)) return;
    if(sl.pos==="BENCH") bench++;
    else field[sl.pos]++;
  });
  return {field,bench};
}
function versusAvailableSlotsForPosition(i,pos){
  // Fuente única de verdad en 1vs1: los huecos visuales realmente libres.
  // Los suplentes NO cuentan como ocupantes de una posición del XI.
  const assigned=S.lineupAssignments[i]||{};
  const occupied=new Set(Object.values(assigned));
  return allVersusPlacementSlots(i).filter(sl=>
    !occupied.has(sl.id) && (sl.pos===pos || sl.pos==="BENCH")
  );
}
function versusCanPickPosition(i,pos){
  return versusAvailableSlotsForPosition(i,pos).length>0;
}

function renderDraft(root){
  if(S.mode==="versus" && S.pendingPlacement){ renderPlacementSelection(root); return; }
  const totalDrafted = Object.values(S.squads).reduce((s,sq)=>s+sq.length,0);
  if(S.roundReview){ renderRoundReview(root); return; }
  if(S.finalLineupReview){ renderFinalLineups(root); return; }
  if(totalDrafted >= S.numPlayers*draftTarget()){
    S.finalLineupReview=true; renderFinalLineups(root); return;
  }
  const playerIdx = currentTurnPlayer();
  const needs = S.needs[playerIdx];
  const squadLen = S.squads[playerIdx].length;
  const turnSize = Math.min(PICKS_PER_ROUND, draftTarget()-squadLen);

  const header = document.createElement("div");
  header.className="panel turn-header";
  header.innerHTML = `
    <div class="turn">Turno de ${escapeHtml(S.names[playerIdx])}</div>
    <div class="sub">Ronda ${S.draftRound} · Tirada ${Math.min((S.roundPicks[playerIdx]||0)+1,turnSize)} de ${turnSize} · Formación ${S.formationChoice[playerIdx]}</div>
    <div class="needs-row">
      ${["GK","DF","MF","FW"].map(pos=>{const n=S.mode==="versus"?versusOpenSlotInfo(playerIdx).field[pos]:needs[pos];return `<span class="need-chip ${n===0?'done':''}">${posLabel(pos)} XI: ${n}</span>`;}).join("")} ${S.mode==="versus"?`<span class="need-chip">Suplentes libres: ${versusOpenSlotInfo(playerIdx).bench}</span>`:''}

function buildReel(reelEl, list, repeats){
  repeats = repeats || 10;
  let html="";
  for(let r=0;r<repeats;r++){
    list.forEach(item=>{ html += `<div class="reel-item">${escapeHtml(item)}</div>`; });
  }
  reelEl.innerHTML = html;
  reelEl.style.transition="none";
  reelEl.style.transform="translateY(0px)";
  reelEl.dataset.list = JSON.stringify(list);
  reelEl.dataset.repeats = repeats;
}

function spinReelTo(reelEl, targetIndex, duration, cb){
  const list = JSON.parse(reelEl.dataset.list);
  const repeats = parseInt(reelEl.dataset.repeats,10);
  const itemH = 46;
  const landingCycle = repeats-2;
  const targetPos = (landingCycle*list.length + targetIndex) * itemH;
  reelEl.style.transition="none";
  reelEl.style.transform="translateY(0px)";
  void reelEl.offsetHeight;
  requestAnimationFrame(()=>{
    reelEl.style.transition=`transform ${duration}ms cubic-bezier(0.12,0.75,0.18,1)`;
    reelEl.style.transform=`translateY(-${targetPos}px)`;
  });
  let done=false;
  const finish=()=>{
    if(done) return;
    done=true;
    reelEl.removeEventListener("transitionend",finish);
    cb();
  };
  reelEl.addEventListener("transitionend",finish);
  setTimeout(finish, duration+120);
}

function spinBothWheels(panel, playerIdx){
  S.spinning = true;
  S.pendingSquadIdx = null;
  panel.querySelector("#spinBtn").disabled = true;
  panel.querySelector("#packReveal").classList.remove("show");

  const targetIdx = randInt(0, REAL_SQUADS.length-1);
  const reelClub = panel.querySelector("#reelClub");
  const reelSeason = panel.querySelector("#reelSeason");

  let finished=0;
  function onOneDone(){
    finished++;
    if(finished===2){
      S.pendingSquadIdx = targetIdx;
      S.spinning = false;
      showSquadReveal(panel, targetIdx, playerIdx);
      panel.querySelector("#spinBtn").disabled = true;
      panel.querySelector("#spinBtn").textContent = "Ruleta ya utilizada";
    }
  }
  spinReelTo(reelClub, targetIdx, 1900, onOneDone);
  spinReelTo(reelSeason, targetIdx, 2300, onOneDone);
}

function draftPick(squadIdx, name, position, playerIdx){
  if(S.mode==="versus" && Object.values(S.squads).flat().some(p=>p.name===name)) return;
  const squad = REAL_SQUADS[squadIdx];
  const stats = statsFor(name, position, squad.tier);
  const player={name, position, ...stats, fromClub:squad.club, fromSeason:squad.season};
  if(S.mode==="versus"){
    S.pendingPlacement={playerIdx,player,squadIdx};
    S.pendingSquadIdx=null;
    render();
    return;
  }
  commitDraftPick(playerIdx,player,null);
}
function commitDraftPick(playerIdx,player,slotId){
  S.squads[playerIdx].push(player);
  if(S.mode!=="versus") S.needs[playerIdx][player.position]--;
  if(S.mode==="versus"){
    if(!S.lineupAssignments[playerIdx]) S.lineupAssignments[playerIdx]={};
    S.lineupAssignments[playerIdx][player.name]=slotId;
  }
  S.picksThisTurn++;
  S.roundPicks[playerIdx]=(S.roundPicks[playerIdx]||0)+1;
  if(S.roundPicks[playerIdx]>=PICKS_PER_ROUND || S.squads[playerIdx].length>=draftTarget()){
    S.picksThisTurn=0; S.turnCounter++;
  }
  // Una ronda termina cuando cada equipo ha hecho sus dos elecciones (o ya ha
  // completado la plantilla). Esta condición explícita evita bloqueos al cerrar
  // la segunda elección.
  const everyoneDone=Array.from({length:S.numPlayers},(_,i)=>
    S.squads[i].length>=draftTarget() || (S.roundPicks[i]||0)>=PICKS_PER_ROUND
  ).every(Boolean);
  S.pendingSquadIdx = null;
  S.pendingPlacement=null;
  if(everyoneDone){
    if(Object.values(S.squads).every(sq=>sq.length>=draftTarget())) {
      S.finalLineupReview=true;
    } else {
      // En 1 vs 1 pasamos directamente a la siguiente ronda.
      // Evita depender de una pantalla intermedia y mantiene el draft siempre activo.
      S.draftRound++;
      S.roundPicks={};
      for(let i=0;i<S.numPlayers;i++) S.roundPicks[i]=0;
      S.roundReview=false;
      S.turnCounter=0;
      S.picksThisTurn=0;
      S.pendingSquadIdx=null;
    }
  }
  render();
}

function resetToMenu(){S={phase:"mode_select",mode:null,match:null,numPlayers:4,names:[],formationChoice:{},formationPickIdx:0,coachChoice:{},kitChoice:{},needs:{},squads:{},order:[],turnCounter:0,picksThisTurn:0,pendingSquadIdx:null,spinning:false,teams:[],bracket:[],roundIndex:0,draftRound:1,roundPicks:{},roundReview:false,finalLineupReview:false,lineupAssignments:{},pendingPlacement:null,preMatchSelection:null};render();}

/* ============================= BUILD TEAMS + BRACKET ============================= */
function computeTeamRating(starters){
  const gk = starters.find(p=>p.position==="GK");
  const dfs = starters.filter(p=>p.position==="DF");
  const mfs = starters.filter(p=>p.position==="MF");
  const fws = starters.filter(p=>p.position==="FW");
  const avg = arr => arr.length ? arr.reduce((s,p)=>s+p.attack,0)/arr.length : 0;
  const avgDef = arr => arr.length ? arr.reduce((s,p)=>s+p.defense,0)/arr.length : 0;
  const attackComposite = Math.round((avg(fws)*3 + avg(mfs)*1.6 + avg(dfs)*0.4) / (3+1.6+0.4));
  const defenseComposite = Math.round((avgDef([gk])*2 + avgDef(dfs)*2.2 + avgDef(mfs)*1.0) / (2+2.2+1.0));
  const overall = Math.round(starters.reduce((s,p)=>s+p.overall,0)/starters.length);
  return {attack:clamp(attackComposite,20,99), defense:clamp(defenseComposite,20,99), overall};
}

function buildTeamsAndBracket(){
  const humanTeams = [];
  for(let i=0;i<S.numPlayers;i++){
    const starters = S.squads[i];
    const r = computeTeamRating(starters);
    const coach=S.coachChoice[i]; const coachMod=coach?(coach.fits.includes(S.formationChoice[i])?coach.bonus:-2):0;
    humanTeams.push({
      name:S.names[i], isHuman:true, formation:S.formationChoice[i], starters, coach, kit:S.kitChoice[i],
      attack:clamp(r.attack+coachMod,20,99), defense:clamp(r.defense+coachMod,20,99), overall:clamp(r.overall+coachMod,20,99)
    });
  }

  let bracketSize = 4;
  while(bracketSize < humanTeams.length) bracketSize*=2;
  const avgOverall = humanTeams.reduce((s,t)=>s+t.overall,0)/humanTeams.length;

  const teams = humanTeams.slice();
  const usedClubNames = new Set();
  while(teams.length < bracketSize){
    let name, tries=0;
    do{ name = pick(CLUB_ADJ)+" "+pick(CLUB_NOUN); tries++; } while(usedClubNames.has(name) && tries<30);
    usedClubNames.add(name);
    const jitter = randInt(-12,12);
    const ov = clamp(Math.round(avgOverall+jitter),40,95);
    teams.push({ name, isHuman:false, attack:clamp(ov+randInt(-5,5),30,99), defense:clamp(ov+randInt(-5,5),30,99), overall:ov });
  }

  for(let i=teams.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [teams[i],teams[j]] = [teams[j],teams[i]];
  }

  const firstRound = [];
  for(let i=0;i<teams.length;i+=2){
    firstRound.push({a:teams[i], b:teams[i+1], scoreA:null, scoreB:null, done:false, winner:null, penalties:null});
  }

  S.teams = teams;
  S.bracket = [firstRound];
  S.roundIndex = 0;
  S.phase = "knockout";
  render();
}

function roundName(numMatches){
  if(numMatches===1) return "Final";
  if(numMatches===2) return "Semifinales";
  if(numMatches===4) return "Cuartos de final";
  if(numMatches===8) return "Octavos de final";
  return "Ronda de "+(numMatches*2);
}

function poissonSample(lambda){
  let L = Math.exp(-lambda), k=0, p=1;
  do{ k++; p*=Math.random(); } while(p>L);
  return k-1;
}
function chooseScorers(team, goals){
  if(!goals) return [];
  if(!team.starters || !team.starters.length) return Array.from({length:goals},()=>"Jugador rival");
  const weighted=[]; team.starters.forEach(p=>{const w=p.position==="FW"?6:p.position==="MF"?3:p.position==="DF"?1:0.25; for(let i=0;i<Math.max(1,Math.round(w));i++)weighted.push(p.name);});
  return Array.from({length:goals},()=>pick(weighted));
}
function simulateMatch(teamA, teamB){
  const expA = clamp(1.25 + (teamA.attack - teamB.defense)/32, 0.15, 4.2);
  const expB = clamp(1.25 + (teamB.attack - teamA.defense)/32, 0.15, 4.2);
  return {scoreA: poissonSample(expA), scoreB: poissonSample(expB)};
}
function simulatePenalties(teamA, teamB){
  const diff = (teamA.overall - teamB.overall);
  const pAWins = clamp(0.5 + diff/200, 0.15, 0.85);
  return Math.random() < pAWins ? "A" : "B";
}

function renderKnockout(root){
  const panel = document.createElement("div");
  panel.className="panel";
  const currentRound = S.bracket[S.roundIndex];
  const allDone = currentRound.every(m=>m.done);
  panel.innerHTML = `<h2 style="font-size:22px;margin-bottom:4px;">${roundName(currentRound.length)}</h2>
    <p class="lead">${allDone ? "Ronda completa." : "Pulsa para simular esta ronda."}</p>`;
  root.appendChild(panel);

  const bracketPanel = document.createElement("div");
  bracketPanel.className="panel";
  bracketPanel.innerHTML = `<div class="bracket" id="bracketWrap"></div>`;
  root.appendChild(bracketPanel);

  S.bracket.forEach((round)=>{
    const col = document.createElement("div");
    col.className="bracket-round";

    round.forEach(m=>{

      matchDiv.innerHTML = `

        <div class="side ${bHuman?'human':''} ${bWin?'winner':''}"><span class="tname">${escapeHtml(bName)}</span><span class="score">${m.done? m.scoreB : '<span class=\"pending\">–</span>'}</span></div>
      `;
      if(m.done && ((m.scorersA&&m.scorersA.length)||(m.scorersB&&m.scorersB.length))){
        const sc=document.createElement("div"); sc.className="scorers"; const parts=[]; if(m.scorersA?.length)parts.push(`${escapeHtml(aName)}: ⚽ ${m.scorersA.map(escapeHtml).join(", ")}`); if(m.scorersB?.length)parts.push(`${escapeHtml(bName)}: ⚽ ${m.scorersB.map(escapeHtml).join(", ")}`); sc.innerHTML=parts.join("<br>"); matchDiv.appendChild(sc);
      }
      if(m.done && m.penalties){
        const pen = document.createElement("div");
        pen.style.fontSize="10px"; pen.style.color="var(--text-faint)"; pen.style.padding="4px 10px";
        pen.textContent = "Penales: gana " + m.penalties;

    });
    wrap.appendChild(col);
  });

  const actions = document.createElement("div");
  actions.className="row";
  actions.style.marginTop="16px";
  if(!allDone){
    const btn = document.createElement("button");
    btn.className="btn btn-primary"; btn.textContent = "Simular ronda";
    btn.addEventListener("click",()=>{ simulateCurrentRound(); render(); });
    actions.appendChild(btn);
  } else if(currentRound.length===1){
    const btn = document.createElement("button");
    btn.className="btn btn-primary"; btn.textContent = "Ver resultado final";
    btn.addEventListener("click",()=>{ S.phase="end"; render(); });
    actions.appendChild(btn);
  } else {
    const btn = document.createElement("button");
    btn.className="btn btn-primary"; btn.textContent = "Siguiente ronda";
    btn.addEventListener("click",()=>{ advanceRound(); render(); });

  }
  root.appendChild(actions);

function simulateCurrentRound(){
  const round = S.bracket[S.roundIndex];
  round.forEach(m=>{
    if(m.done) return;
    let {scoreA,scoreB} = simulateMatch(m.a, m.b);
    let penalties = null;
    if(scoreA===scoreB){
      const winnerSide = simulatePenalties(m.a,m.b);
      penalties = winnerSide==="A" ? m.a.name : m.b.name;
      m.winner = winnerSide==="A" ? m.a : m.b;
    } else {
      m.winner = scoreA>scoreB ? m.a : m.b;
    }
    m.scoreA = scoreA; m.scoreB = scoreB; m.scorersA=chooseScorers(m.a,scoreA); m.scorersB=chooseScorers(m.b,scoreB); m.penalties = penalties; m.done = true;
  });
}

function advanceRound(){
  const round = S.bracket[S.roundIndex];
  const winners = round.map(m=>m.winner);
  const nextRound = [];
  for(let i=0;i<winners.length;i+=2){
    nextRound.push({a:winners[i], b:winners[i+1], scoreA:null, scoreB:null, done:false, winner:null, penalties:null});
  }
  S.bracket.push(nextRound);
  S.roundIndex++;
}

function renderEnd(root){

      const m = S.bracket[ri].find(mm=>mm.a===t || mm.b===t);
      if(!m) continue;
      if(m.winner===t){
        if(ri===S.bracket.length-1) reached = "🏆 Campeón";
        else reached = "Avanzó a " + roundName(S.bracket[ri+1].length);
      } else {
        reached = "Eliminado en " + roundName(S.bracket[ri].length);
      }
    }
    return {name:t.name, reached, champion: t===champion};
  });
  wrap.innerHTML = results.map(r=>`
    <div class="srow human ${r.champion?'champion':''}">
      <span>${escapeHtml(r.name)}</span><span>${r.reached}</span>
    </div>
  `).join("");

  panel.querySelector("#restartBtn").addEventListener("click",()=>{
    resetToMenu();
  });
}

/* ============================= INIT ============================= */
render();
</script>
</body>
</html>
